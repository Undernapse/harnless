[package]
name = "dsh-runtime"
description = "The Cordis-equivalent service-context runtime for the deepseek-harness clone: type-token service map, typed events with five dispatch modes, fiber-owned reversible effects, and plugin lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "sync"] }
