[package]
name = "dsh-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Session log, agent loop, system-prompt assembly, and core spine services"

[dependencies]
dsh-runtime = { path = "../dsh-runtime" }
parking_lot = "0.12"
dsh-seams = { path = "../dsh-seams" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
