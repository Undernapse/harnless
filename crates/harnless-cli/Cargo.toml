[package]
name = "harnless-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The harnless CLI (hrls): profile-driven headless runner, REPL entry, and config dump."

[dependencies]
harnless-runtime = { path = "../harnless-runtime" }
harnless-seams = { path = "../harnless-seams" }
harnless-agent = { path = "../harnless-agent" }
harnless-config = { path = "../harnless-config" }
harnless-llm-replay = { path = "../harnless-llm-replay" }
harnless-storage-jsonl = { path = "../harnless-storage-jsonl" }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
parking_lot = "0.12"

[[bin]]
name = "hrls"
path = "src/main.rs"

[features]
# Test-only seams (the durability seam's direct-spine window). Enabled by
# default so `cargo test` (and CI's plain `cargo test --workspace`) builds
# the seam suite without a feature flag. The cost is real: the release
# binary compiles the seam helpers and `mount_seeded_body`'s hook dispatch
# (a thread-local lock + Arc clone per mount, inert — nothing in the
# binary can arm the hook). Making the feature non-default would instead
# ship the seam tests as silently skipped (`required-features` below),
# which is the worse failure for a suite whose contract is CI-green.
default = ["test-cfg"]
test-cfg = []

[[test]]
name = "durability_seam"
required-features = ["test-cfg"]

[dev-dependencies]
tempfile = "3"
