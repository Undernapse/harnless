[package]
name = "harnless-seams"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Seam trait definitions (service definitions) for harnless"

[dependencies]
harnless-runtime = { path = "../harnless-runtime" }
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
