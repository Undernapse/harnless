[package]
name = "harnless-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Session log, agent loop, system-prompt assembly, and core spine services"

[dependencies]
harnless-runtime = { path = "../harnless-runtime" }
parking_lot = "0.12"
harnless-seams = { path = "../harnless-seams" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
