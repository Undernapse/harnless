[package]
name = "harnless-llm-replay"
description = "Deterministic replay model adapter for harnless: replays a recorded model stream with no network, for tests and demos."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
harnless-seams = { path = "../harnless-seams" }
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
harnless-agent = { path = "../harnless-agent" }
harnless-runtime = { path = "../harnless-runtime" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
