[package]
name = "harnless-runtime"
description = "The harnless service-context runtime: type-token service map, typed events with five dispatch modes, fiber-owned reversible effects, and plugin lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot = "0.12"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
